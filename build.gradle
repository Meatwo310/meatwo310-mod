import java.time.ZonedDateTime
import java.time.format.DateTimeFormatter

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}


version = "v${mod_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
//    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mixin.config', "${mod_id}.mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.projectDir}/build/createSrgToMcp/output.srg"
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
//    flatDir {
//        dir 'libs'
//    }
    maven { url = "https://maven.architectury.dev" }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        forRepositories fg.repository
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = uri('https://cursemaven.com')
            }
        }
        forRepositories fg.repository
        filter {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

//    // Mixin Extras
//    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.0'))
//    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.5.0')) {
//        jarJar.ranged(it, '[0.5.0,)')
//    }
    implementation fg.deobf("curse.maven:cloth-config-348521:5729105")
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")
    implementation fg.deobf("curse.maven:timeless-and-classics-zero-1028108:7401617")
    compileOnly fg.deobf("curse.maven:timeless-and-classics-zero-1028108:7401617")
    runtimeOnly fg.deobf("curse.maven:embeddium-908741:5681725")
    implementation fg.deobf("curse.maven:chloride-931925:6504509")
    compileOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:11.0.99")
    compileOnly fg.deobf("dev.architectury:architectury-forge:9.0.7")
    implementation fg.deobf("curse.maven:roughly-enough-items-hacks-521393:4837449")
    compileOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-api-forge:12.1.758")
    runtimeOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:12.1.758")
    // Default Dependencies
    implementation fg.deobf("curse.maven:roughly-enough-items-hacks-521393:4837449")
    runtimeOnly fg.deobf('curse.maven:catalogue-459701:4766090')
    runtimeOnly fg.deobf('curse.maven:configured-457570:5180900')
    runtimeOnly fg.deobf('curse.maven:jade-324717:6855440')
    runtimeOnly fg.deobf("curse.maven:appleskin-248787:4770828")
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE

    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(replaceProperties + [project: project])
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': ZonedDateTime.now().format(DateTimeFormatter.ofPattern("yyyy-MM-dd'T'HH:mm:ssZ")),
            // Ensure mixin config is discovered even if mods.toml mixin discovery is skipped in some environments.
            'MixinConfigs'            : "${mod_id}.mixins.json"
        )
    }
    finalizedBy 'reobfJar'
}

tasks.register('pruneOldModJars') {
    group = 'build'
    description = 'Removes previously built jars for this mod to avoid shipping or testing the wrong version.'

    doLast {
        def libsDir = layout.buildDirectory.dir('libs').get().asFile
        if (!libsDir.exists()) return

        def currentJarName = "${base.archivesName.get()}-${project.version}.jar"
        fileTree(libsDir) {
            include "${base.archivesName.get()}-*.jar"
            exclude currentJarName
        }.files.each { oldJar ->
            if (oldJar.delete()) {
                logger.lifecycle("Deleted old mod jar: ${oldJar.name}")
            } else {
                logger.warn("Failed to delete old mod jar: ${oldJar.name}")
            }
        }
    }
}

tasks.named('jar').configure {
    dependsOn 'pruneOldModJars'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}

tasks.register('setupServer') {
    group = 'custom'
    description = 'Sets up the server run directory with eula.txt and server.properties'

    doLast {
        file('run-server').mkdirs()
        file('run-server/eula.txt').text = 'eula=true'
        file('run-server/server.properties').text = '''
allow-flight=true
enable-command-block=true
gamemode=creative
online-mode=false
spawn-protection=0
'''.stripIndent().trim()
    }
}

tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn 'setupServer'
}
